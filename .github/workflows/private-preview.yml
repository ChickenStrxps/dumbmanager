name: Windows preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build Windows preview
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}/backend;${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Source inventory and syntax
        run: python -B tools/verify_public.py
      - name: API tests
        run: python -B tools/test_suite.py api
      - name: Host tests
        run: python -B tools/test_suite.py host
      - name: Disposable first run
        run: python -B tools/host_smoke.py
      - name: Browser tools
        run: python -m pip install playwright==1.64.1
      - name: Disposable browser navigation
        run: python -B tools/public_browser_smoke.py
      - name: Build tools
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Candidate EXE
        run: python -m PyInstaller --noconfirm --clean packaging/DumbManager.spec
      - name: Frozen executable first run
        run: python -B tools/frozen_smoke.py
      - name: Matching complete source ZIP and checksums
        shell: python
        run: |
          import hashlib,os,pathlib,subprocess
          out=pathlib.Path('dist');out.mkdir(exist_ok=True)
          sha=os.environ['GITHUB_SHA']
          archive=out/('DumbManager-source-'+sha[:12]+'.zip')
          subprocess.run(['git','archive','--format=zip','--prefix=DumbManager/','--output='+str(archive),sha],check=True)
          files=[out/'DumbManager.exe',archive]
          (out/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          (out/'SOURCE-COMMIT.txt').write_text(sha+'\nUnsigned preview; clean-install validation pending.\n')
      - name: Save candidate assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-preview-${{ github.sha }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
  publish:
    name: Save draft release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Verify assets and save a draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          repo=os.environ['GITHUB_REPOSITORY'];sha=os.environ['GITHUB_SHA']
          run=os.environ['GITHUB_RUN_ID'];out=pathlib.Path('dist')
          subprocess.run(['gh','run','download',run,'--repo',repo,'--name','windows-preview-'+sha+'-'+run,'--dir',str(out)],check=True)
          required=['DumbManager.exe','DumbManager-source-'+sha[:12]+'.zip','SHA256SUMS.txt','SOURCE-COMMIT.txt','BUILD-VALIDATION.json','api-checks.json','host-checks.json']
          for name in required:assert (out/name).is_file() and (out/name).stat().st_size>0,name
          assert (out/'SOURCE-COMMIT.txt').read_text().splitlines()[0]==sha
          sums=(out/'SHA256SUMS.txt').read_text()
          for name in required[:2]:assert hashlib.sha256((out/name).read_bytes()).hexdigest()+'  '+name in sums
          for name in ['api-checks.json','host-checks.json']:assert json.loads((out/name).read_text())['successful'] is True
          frozen=json.loads((out/'BUILD-VALIDATION.json').read_text())
          assert frozen['success'] is True and frozen['stop_exit']==0
          tag='preview-'+sha[:12];notes=out/'RELEASE-NOTES.md'
          notes.write_text('Windows preview. Download DumbManager.exe to run the app, or use the matching complete source ZIP.\n\nUnsigned executable; clean-machine and live-provider testing remain pending. Verification reports and checksums stay in the Actions build artifact.\n\nSource commit: '+sha+'\n',encoding='utf-8')
          existing=subprocess.run(['gh','api','repos/'+repo+'/releases/tags/'+tag],capture_output=True,text=True)
          assets=[str(out/name) for name in required[:2]]
          if existing.returncode==0:
              draft=json.loads(existing.stdout)
              assert draft['draft'] is True,'This preview is already published; use a new source commit.'
              for asset in draft['assets']:
                  if asset['name'] not in required[:2]:
                      subprocess.run(['gh','api','repos/'+repo+'/releases/assets/'+str(asset['id']),'--method','DELETE'],check=True)
              subprocess.run(['gh','release','upload',tag,'--repo',repo,'--clobber',*assets],check=True)
              subprocess.run(['gh','release','edit',tag,'--repo',repo,'--notes-file',str(notes)],check=True)
          else:
              subprocess.run(['gh','release','create',tag,'--repo',repo,'--target',sha,'--draft','--prerelease','--title','DumbManager Windows preview','--notes-file',str(notes),*assets],check=True)
