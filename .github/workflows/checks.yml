name: Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}/backend;${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Source inventory and syntax
        run: python -B tools/verify_public.py
      - name: API tests
        run: python -B tools/test_suite.py api
      - name: Host tests
        run: python -B tools/test_suite.py host
      - name: Disposable first run
        run: python -B tools/host_smoke.py
      - name: Browser tools
        run: python -m pip install playwright==1.64.1
      - name: Disposable browser navigation
        run: python -B tools/public_browser_smoke.py
      - name: Save check reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checks-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
